<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#181613" />
<title>Beach-volley · Saint-Malo (mobile)</title>
<style>
  :root {
    --paper: #faf7f0;
    --ink: #181613;
    --ink-soft: #4a4641;
    --rule: #d8d1c1;
    --card: #ffffff;
    --go: #2f7d3a;
    --warn: #b88a2e;
    --no: #8a2a1f;
    --sea: #2a6ea8;
    --s5: #2f7d3a;
    --s4: #7aa53a;
    --s3: #c99a2b;
    --s2: #c76a2a;
    --s1: #8a2a1f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }

  /* Sticky verdict header */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--ink);
    color: var(--paper);
    padding: 14px 18px calc(14px + env(safe-area-inset-top, 0)) 18px;
    padding-top: calc(14px + env(safe-area-inset-top, 0));
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  .topbar .kicker {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.65;
  }
  .topbar .verdict {
    font-family: "Didot", "Bodoni 72", Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.1;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar .dot {
    width: 14px;
    height: 14px;
    border-radius: 999px;
    background: var(--warn);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
  }
  .topbar .dot.s5 { background: var(--s5); }
  .topbar .dot.s4 { background: var(--s4); }
  .topbar .dot.s3 { background: var(--s3); }
  .topbar .dot.s2 { background: var(--s2); }
  .topbar .dot.s1 { background: var(--s1); }
  .topbar .when {
    font-size: 13px;
    opacity: 0.85;
  }

  .container {
    padding: 16px 14px 40px;
  }

  h2.section {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
    margin: 22px 4px 10px;
  }
  h2.section:first-of-type { margin-top: 6px; }

  /* Day tabs */
  .day-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .day-tab {
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--ink);
    border-radius: 12px;
    padding: 10px 6px;
    font: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .day-tab .top {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .day-tab .main {
    font-family: "Didot", "Bodoni 72", Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 20px;
  }
  .day-tab .sub {
    font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .day-tab[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .day-tab[aria-pressed="true"] .top,
  .day-tab[aria-pressed="true"] .sub { color: var(--paper); opacity: 0.75; }
  .day-tab.today .top { color: var(--sea); }
  .day-tab[aria-pressed="true"].today { background: var(--sea); border-color: var(--sea); }

  /* Hourly rows */
  .hours {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .hour-row {
    display: grid;
    grid-template-columns: 8px 56px 1fr auto;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 10px 12px 10px 0;
    font: inherit;
    text-align: left;
    color: var(--ink);
    cursor: pointer;
    min-height: 60px;
    transition: transform .1s;
  }
  .hour-row:active { transform: scale(0.98); }
  .hour-row .bar {
    height: 100%;
    min-height: 40px;
    border-radius: 12px 0 0 12px;
    background: var(--rule);
    align-self: stretch;
  }
  .hour-row.s5 .bar { background: var(--s5); }
  .hour-row.s4 .bar { background: var(--s4); }
  .hour-row.s3 .bar { background: var(--s3); }
  .hour-row.s2 .bar { background: var(--s2); }
  .hour-row.s1 .bar { background: var(--s1); }
  .hour-row.selected {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px var(--ink) inset;
  }
  .hour-row .hour {
    font-family: "Didot", "Bodoni 72", Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 26px;
    line-height: 1;
    padding-left: 4px;
  }
  .hour-row .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .hour-row .stats .stat {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .hour-row .stats .stat b {
    color: var(--ink);
    font-weight: 700;
  }
  .hour-row .verdict-tag {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink-soft);
  }
  .hour-row.s5 .verdict-tag { color: var(--s5); border-color: var(--s5); }
  .hour-row.s4 .verdict-tag { color: var(--s4); border-color: var(--s4); }
  .hour-row.s3 .verdict-tag { color: var(--s3); border-color: var(--s3); }
  .hour-row.s2 .verdict-tag { color: var(--s2); border-color: var(--s2); }
  .hour-row.s1 .verdict-tag { color: var(--s1); border-color: var(--s1); }
  .hour-row.disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  /* Detail card */
  .detail {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 14px 14px 8px;
  }
  .detail-title {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .metric {
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 10px 12px;
    background: var(--paper);
  }
  .metric .label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .metric .value {
    font-family: "Didot", "Bodoni 72", Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 24px;
    line-height: 1.15;
    margin-top: 2px;
  }
  .metric .sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .metric.go   .value { color: var(--go); }
  .metric.warn .value { color: var(--warn); }
  .metric.no   .value { color: var(--no); }

  .rules-line {
    margin-top: 10px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    padding: 8px 4px 6px;
    border-top: 1px dashed var(--rule);
  }

  /* Legend */
  .legend {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 4px 4px 0;
  }
  .legend .grad {
    flex: 1;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(to right, var(--s1), var(--s2), var(--s3), var(--s4), var(--s5));
  }

  footer {
    margin-top: 24px;
    padding: 12px 4px 0;
    border-top: 1px solid var(--rule);
    font-size: 11px;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  footer a { color: var(--sea); text-decoration: none; }

  /* Larger phones */
  @media (min-width: 480px) {
    .container { padding: 18px 22px 48px; max-width: 560px; margin: 0 auto; }
    .topbar { padding-left: 22px; padding-right: 22px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <span class="kicker">Beach-volley · Rochebonne</span>
  <div class="verdict"><span class="dot" id="dot"></span><span id="verdictText">À vérifier</span></div>
  <span class="when" id="whenLabel">…</span>
</header>

<div class="container">

  <h2 class="section">Jour</h2>
  <div class="day-tabs" id="dayTabs" role="tablist"></div>

  <h2 class="section" id="hoursTitle">Heures — 09h à 21h</h2>
  <div class="hours" id="hours"></div>
  <div class="legend" aria-hidden="true">
    <span>Non</span>
    <span class="grad"></span>
    <span>Oui</span>
  </div>

  <h2 class="section">Détail du créneau</h2>
  <div class="detail" id="detail">
    <div class="detail-title" id="detailTitle">…</div>
    <div class="detail-grid">
      <div class="metric" id="mWind">
        <div class="label">Vent</div>
        <div class="value">—</div>
        <div class="sub">Seuil&nbsp;: &lt;&nbsp;25&nbsp;km/h</div>
      </div>
      <div class="metric" id="mTide">
        <div class="label">Marée</div>
        <div class="value">—</div>
        <div class="sub">Seuil&nbsp;: &lt;&nbsp;9&nbsp;m</div>
      </div>
      <div class="metric" id="mRainNow">
        <div class="label">Pluie</div>
        <div class="value">—</div>
        <div class="sub">au créneau</div>
      </div>
      <div class="metric" id="mRainNext">
        <div class="label">Pluie 3&nbsp;h</div>
        <div class="value">—</div>
        <div class="sub">cumul suivant</div>
      </div>
    </div>
    <div class="rules-line" id="rulesLine">…</div>
  </div>

  <footer>
    <span>Saint-Malo · Côte d'Émeraude</span>
    <span>Données&nbsp;: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></span>
  </footer>
</div>

<script>
  const dayTabsEl   = document.getElementById('dayTabs');
  const hoursEl     = document.getElementById('hours');
  const hoursTitleEl= document.getElementById('hoursTitle');
  const dotEl       = document.getElementById('dot');
  const verdictText = document.getElementById('verdictText');
  const whenLabelEl = document.getElementById('whenLabel');
  const detailTitle = document.getElementById('detailTitle');
  const rulesLineEl = document.getElementById('rulesLine');
  const mWind = document.getElementById('mWind');
  const mTide = document.getElementById('mTide');
  const mRainNow = document.getElementById('mRainNow');
  const mRainNext = document.getElementById('mRainNext');

  const SAINT_MALO_MSL_ABOVE_CHART = 6.62;

  const forecast = {
    loaded: false, error: null,
    hours: [], precip: [], windSpeed: [], windGust: [], windDir: [],
    tideHours: [], tideLevels: []
  };

  const DAY_LABELS   = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
  const MONTH_LABELS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  const pad = n => String(n).padStart(2,'0');
  const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
  const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();

  const now = new Date();
  const today0 = startOfDay(now);
  let selDay = new Date(today0);
  let selHour = Math.min(21, Math.max(9, now.getHours() + 1));

  function findHourIndex(arr, target) {
    if (!arr.length || !target) return -1;
    const t = target.getTime();
    let best = -1, bestDiff = Infinity;
    for (let i=0;i<arr.length;i++){
      const d = Math.abs(arr[i].getTime() - t);
      if (d < bestDiff){ bestDiff = d; best = i; }
    }
    return bestDiff <= 30*60*1000 ? best : -1;
  }

  function degToCompass(deg) {
    const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
    return dirs[Math.round(((deg % 360) / 22.5)) % 16];
  }

  function tideAt(target) {
    if (!forecast.tideHours.length) return null;
    const t = target.getTime();
    let i = 0;
    while (i < forecast.tideHours.length - 1 && forecast.tideHours[i+1].getTime() <= t) i++;
    const t0 = forecast.tideHours[i].getTime();
    const t1 = forecast.tideHours[Math.min(i+1, forecast.tideHours.length-1)].getTime();
    const v0 = Number(forecast.tideLevels[i]);
    const v1 = Number(forecast.tideLevels[Math.min(i+1, forecast.tideLevels.length-1)]);
    const inRange = t >= forecast.tideHours[0].getTime() && t <= forecast.tideHours[forecast.tideHours.length-1].getTime();
    if (!inRange || isNaN(v0) || isNaN(v1)) return null;
    const frac = t1 > t0 ? Math.min(1, Math.max(0, (t - t0) / (t1 - t0))) : 0;
    return v0 + (v1 - v0) * frac + SAINT_MALO_MSL_ABOVE_CHART;
  }

  function slotData(day, hour) {
    const target = new Date(day); target.setHours(hour, 0, 0, 0);
    const idx = findHourIndex(forecast.hours, target);
    const wind = idx >= 0 ? Number(forecast.windSpeed[idx]) : null;
    const gust = idx >= 0 ? Number(forecast.windGust[idx]) : null;
    const dir  = idx >= 0 ? Number(forecast.windDir[idx])  : null;
    const rain = idx >= 0 ? Number(forecast.precip[idx])   : null;
    let rainNext3 = null;
    if (idx >= 0) {
      let sum = 0;
      for (let i = idx+1; i <= idx+3 && i < forecast.precip.length; i++) sum += Number(forecast.precip[i]) || 0;
      rainNext3 = sum;
    }
    const tide = tideAt(target);
    return { target, wind, gust, dir, rain, rainNext3, tide };
  }

  // 1 (worst) → 5 (best).
  function scoreSlot(wind, tide, rainMm) {
    if (wind == null || tide == null || rainMm == null) return null;
    if (tide >= 9 || rainMm >= 0.5 || wind >= 25) return 1;
    let s = 5;
    if (wind >= 20) s = Math.min(s, 2);
    else if (wind >= 15) s = Math.min(s, 3);
    else if (wind >= 10) s = Math.min(s, 4);
    if (rainMm >= 0.1) s = Math.min(s, 2);
    else if (rainMm >= 0.05) s = Math.min(s, 3);
    if (tide >= 8.5) s = Math.min(s, 3);
    else if (tide >= 8.0) s = Math.min(s, 4);
    return s;
  }

  function scoreLabel(s) {
    return s >= 5 ? 'On joue' :
           s === 4 ? 'OK' :
           s === 3 ? 'Limite' :
           s === 2 ? 'Difficile' :
           s === 1 ? 'Non' : '—';
  }

  function buildDayTabs() {
    dayTabsEl.innerHTML = '';
    for (let offset = 0; offset <= 3; offset++) {
      const d = new Date(today0);
      d.setDate(d.getDate() + offset);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day-tab' + (offset === 0 ? ' today' : '');
      btn.setAttribute('role', 'tab');
      const top = offset === 0 ? 'Auj.' : DAY_LABELS[d.getDay()];
      btn.innerHTML = `<span class="top">${top}</span><span class="main">${d.getDate()}</span><span class="sub">${MONTH_LABELS[d.getMonth()]}</span>`;
      btn.dataset.time = String(d.getTime());
      btn.addEventListener('click', () => {
        selDay = new Date(d);
        markDayTabs();
        renderHours();
        renderDetail();
      });
      dayTabsEl.appendChild(btn);
    }
    markDayTabs();
  }

  function markDayTabs() {
    for (const b of dayTabsEl.children) {
      const d = new Date(Number(b.dataset.time));
      b.setAttribute('aria-pressed', String(sameDay(d, selDay)));
    }
  }

  function renderHours() {
    hoursEl.innerHTML = '';
    const dayLabel = selDay.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
    hoursTitleEl.textContent = `Heures — ${dayLabel}`;

    for (let h = 9; h <= 21; h++) {
      const { wind, gust, dir, rain, tide } = slotData(selDay, h);
      const score = scoreSlot(wind, tide, rain);
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'hour-row' + (score ? ' s' + score : ' disabled') + (h === selHour ? ' selected' : '');
      row.disabled = score == null;

      const windTxt = wind != null ? `${Math.round(wind)} km/h${dir != null ? ' ' + degToCompass(dir) : ''}` : '—';
      const tideTxt = tide != null ? `${tide.toFixed(2)} m` : '—';
      const rainTxt = rain != null
        ? (rain < 0.05 ? 'sec' : `${rain.toFixed(1)} mm/h`)
        : '—';

      row.innerHTML = `
        <span class="bar" aria-hidden="true"></span>
        <span class="hour">${pad(h)}h</span>
        <span class="stats">
          <span class="stat"><b>Vent</b> ${windTxt}</span>
          <span class="stat"><b>Marée</b> ${tideTxt}</span>
          <span class="stat"><b>Pluie</b> ${rainTxt}</span>
        </span>
        <span class="verdict-tag">${scoreLabel(score)}</span>
      `;
      row.addEventListener('click', () => {
        if (row.disabled) return;
        selHour = h;
        for (const r of hoursEl.children) r.classList.remove('selected');
        row.classList.add('selected');
        renderDetail();
      });
      hoursEl.appendChild(row);
    }
  }

  function metricClass(kind, v) {
    if (v == null) return '';
    if (kind === 'wind') return v < 15 ? 'go' : (v <= 25 ? 'warn' : 'no');
    if (kind === 'tide') return v < 8.5 ? 'go' : (v < 9 ? 'warn' : 'no');
    if (kind === 'rain') return v < 0.1 ? 'go' : 'no';
    if (kind === 'rain3') return v < 0.2 ? 'go' : (v < 1 ? 'warn' : 'no');
    return '';
  }
  function setMetric(el, kind, value, subLine) {
    const cls = metricClass(kind, value);
    el.classList.remove('go','warn','no');
    if (cls) el.classList.add(cls);
    const valEl = el.querySelector('.value');
    const subEl = el.querySelector('.sub');
    valEl.textContent = value == null ? '—'
      : kind === 'wind'  ? `${Math.round(value)} km/h`
      : kind === 'tide'  ? `${value.toFixed(2)} m`
      : kind === 'rain'  ? (value < 0.05 ? 'sec' : `${value.toFixed(1)} mm/h`)
      : kind === 'rain3' ? (value < 0.05 ? 'sec' : `${value.toFixed(1)} mm`)
      : String(value);
    if (subLine) subEl.textContent = subLine;
  }

  function renderDetail() {
    const { target, wind, gust, dir, rain, rainNext3, tide } = slotData(selDay, selHour);
    const score = scoreSlot(wind, tide, rain);
    const when = target.toLocaleString('fr-FR', { weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });
    whenLabelEl.textContent = when;
    detailTitle.textContent = when;

    dotEl.classList.remove('s1','s2','s3','s4','s5');
    if (score) dotEl.classList.add('s' + score);
    verdictText.textContent = score == null ? 'Données manquantes' : (
      score >= 5 ? 'On joue !' :
      score === 4 ? 'Ça passe' :
      score === 3 ? 'Limite' :
      score === 2 ? 'Difficile' : 'On ne joue pas'
    );

    setMetric(mWind, 'wind', wind, gust != null ? `Rafales ${Math.round(gust)} km/h${dir != null ? ' · ' + degToCompass(dir) : ''}` : 'Seuil : < 25 km/h');
    setMetric(mTide, 'tide', tide, 'Seuil : < 9 m');
    setMetric(mRainNow, 'rain', rain, 'au créneau');
    setMetric(mRainNext, 'rain3', rainNext3, 'cumul 3 h après');

    if (score == null) {
      rulesLineEl.textContent = 'Prévisions indisponibles pour ce créneau.';
    } else {
      const parts = [];
      parts.push(wind != null ? `vent ${Math.round(wind)} km/h` : 'vent ?');
      parts.push(tide != null ? `marée ${tide.toFixed(1)} m` : 'marée ?');
      parts.push(rain != null ? (rain < 0.05 ? 'sec' : `pluie ${rain.toFixed(1)} mm/h`) : 'pluie ?');
      rulesLineEl.textContent = parts.join(' · ');
    }
  }

  async function fetchWeather() {
    const url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=48.65&longitude=-2.026'
      + '&hourly=precipitation,wind_speed_10m,wind_gusts_10m,wind_direction_10m'
      + '&wind_speed_unit=kmh'
      + '&forecast_days=4&timezone=Europe%2FParis';
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const times = data?.hourly?.time ?? [];
      forecast.hours = times.map(t => new Date(t));
      forecast.precip = data?.hourly?.precipitation ?? [];
      forecast.windSpeed = data?.hourly?.wind_speed_10m ?? [];
      forecast.windGust = data?.hourly?.wind_gusts_10m ?? [];
      forecast.windDir = data?.hourly?.wind_direction_10m ?? [];
      forecast.loaded = true;
    } catch (e) {
      forecast.error = e.message || 'erreur';
    }
    renderHours(); renderDetail();
  }
  async function fetchTide() {
    const url = 'https://marine-api.open-meteo.com/v1/marine'
      + '?latitude=48.65&longitude=-2.026'
      + '&hourly=sea_level_height_msl'
      + '&timezone=Europe%2FParis&forecast_days=4';
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const times = data?.hourly?.time ?? [];
      const levels = data?.hourly?.sea_level_height_msl ?? [];
      if (times.length && levels.length) {
        forecast.tideHours = times.map(t => new Date(t));
        forecast.tideLevels = levels;
      }
    } catch (e) { /* silent */ }
    renderHours(); renderDetail();
  }

  buildDayTabs();
  renderHours();
  renderDetail();
  fetchWeather();
  fetchTide();

  // Scroll the current hour into view once data loads (nice UX on first open).
  window.addEventListener('load', () => {
    const sel = hoursEl.querySelector('.hour-row.selected');
    if (sel) sel.scrollIntoView({ block: 'center' });
  });
</script>
</body>
</html>
